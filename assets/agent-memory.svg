<text x="415" y="426" text-anchor="middle" font-size="15" font-weight="400" fill="#64748b">events</text>
<rect x="40" y="565" width="340" height="102" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="210" y="602" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">4 · Skills and programs</text>
<text x="210" y="634" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">Retrieval and memory procedures</text>
<path d="M 392 602 L 439 602" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="415" y="588" text-anchor="middle" font-size="15" font-weight="400" fill="#64748b">tools</text>
<rect x="1080" y="265" width="320" height="87" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="1240" y="300" text-anchor="middle" font-size="25" font-weight="700" fill="#3730a3">Task agent</text>
<text x="1240" y="328" text-anchor="middle" font-size="18" font-weight="400" fill="#4f46e5">Works on a scoped responsibility</text>
<path d="M 1069 306 L 1002 306" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1035" y="291" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">query</text>
<rect x="1080" y="442" width="320" height="164" rx="14" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.5"/>
<text x="1240" y="480" text-anchor="middle" font-size="24" font-weight="700" fill="#115e59">5 · Context compiler</text>
<text x="1240" y="516" text-anchor="middle" font-size="19" font-weight="400" fill="#0f766e">Approved evidence and views</text>
<text x="1240" y="546" text-anchor="middle" font-size="19" font-weight="400" fill="#0f766e">Task state and skills</text>
<text x="1240" y="577" text-anchor="middle" font-size="18" font-weight="400" fill="#0f766e">What this task needs now</text>
<path d="M 1002 478 L 1069 478" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1035" y="462" text-anchor="middle" font-size="16" font-weight="400" fill="#64748b">context</text>
<path d="M 1240 430 L 1240 364" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1260" y="401" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">active context</text>
<rect x="1080" y="627" width="320" height="40" rx="10" fill="#f1f5f9" stroke="#dbe3ed" stroke-width="1.5"/>
<text x="1240" y="653" text-anchor="middle" font-size="19" font-weight="700" fill="#475569">No direct memory access</text>
<rect x="40" y="720" width="1360" height="106" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="720" y="757" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">3 · Durable work runtime</text>
<text x="720" y="790" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">Runs both paths: checkpoints · event triggers · scheduling · retries · cancellation · audit</text>
<text x="40" y="870" text-anchor="start" font-size="20" font-weight="400" fill="#64748b">Async maintenance builds memory over time. Sync requests supply authorized context for the current task.</text>
</g>
