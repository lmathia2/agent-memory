<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">The five capabilities: agentic memory and active context</title>
<desc id="desc">Personal timeline events ground a memory agent representing the user. The agent uses asynchronous maintenance tools and synchronous context tools. A task agent queries the memory agent and receives only approved compiled context. Versioned skills support both paths, and the durable runtime executes both. The user constitution and enterprise authority govern access and sharing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1440" height="900" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="48" text-anchor="start" font-size="30" font-weight="700" fill="#0f172a">Agentic memory and active context</text>
<text x="40" y="76" text-anchor="start" font-size="20" font-weight="400" fill="#64748b">An expansion of the five capabilities in the brief</text>
<rect x="40" y="105" width="1360" height="112" rx="18" fill="#fffbeb" stroke="#e7ca83" stroke-width="1.5"/>
<text x="65" y="139" text-anchor="start" font-size="24" font-weight="700" fill="#92400e">User constitution</text>
<text x="65" y="172" text-anchor="start" font-size="19" font-weight="400" fill="#8c6429">What may be shared, with which task, and for what purpose</text>
<text x="65" y="199" text-anchor="start" font-size="19" font-weight="400" fill="#8c6429">User settings and context-presentation preferences</text>
<path d="M 850 125 L 850 197" stroke="#e7ca83" stroke-width="1.5"/>
