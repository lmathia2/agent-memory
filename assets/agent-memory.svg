<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1430" viewBox="0 0 1440 1430" role="img" aria-labelledby="title desc">
<title id="title">Agentic memory: synchronous task queries and asynchronous maintenance</title>
<desc id="desc">Task agents decompose user queries into memory queries. A user-representing memory agent retrieves and transforms query-relevant evidence under the constitution and enterprise permissions. Its asynchronous mode maintains derived memory. Both modes access the same personal timeline and derived memory through governed tools, independently of storage adapters. Durable work and skills support both modes.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1440" height="1430" fill="white"/><g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="48" text-anchor="start" font-size="30" fill="#0f172a" font-weight="700">Agentic memory: two modes, shared evidence</text>
<rect x="70" y="112" width="590" height="114" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="365" y="150" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="700">Timeline events · Schedule · Explicit request</text>
<text x="365" y="185" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">Wake asynchronous memory maintenance</text>
<path d="M 365 238 L 365 297" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)"/>
<text x="385" y="274" text-anchor="start" font-size="18" fill="#64748b" font-weight="400">async trigger</text>
<text x="1070" y="80" text-anchor="middle" font-size="21" fill="#64748b" font-weight="700">User query</text>
<rect x="750" y="94" width="620" height="156" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="1060" y="128" text-anchor="middle" font-size="25" fill="#3730a3" font-weight="700">Task-specific agent</text>
<text x="1060" y="157" text-anchor="middle" font-size="19" fill="#4f46e5" font-weight="400">Decomposes memory needs; reasons with responses</text>
<text x="1060" y="191" text-anchor="middle" font-size="22" fill="#3730a3" font-weight="700">5 · Context compiler</text>
<text x="1060" y="220" text-anchor="middle" font-size="19" fill="#4f46e5" font-weight="400">Returned memory + task state + skills</text>
<path d="M 980 262 L 980 297" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)"/>
<text x="960" y="284" text-anchor="end" font-size="18" fill="#64748b" font-weight="400">memory queries</text>
<path d="M 1220 297 L 1220 262" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)"/>
<text x="1240" y="284" text-anchor="start" font-size="18" fill="#64748b" font-weight="400">relevant context</text>
<rect x="40" y="310" width="1360" height="390" rx="20" fill="#f8fafc" stroke="#b9c7da" stroke-width="1.5"/>
<text x="720" y="347" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">2 · Memory agent — represents the user</text>
<rect x="70" y="369" width="1300" height="64" rx="12" fill="#fffbeb" stroke="#e7ca83" stroke-width="1.5"/>
<text x="720" y="395" text-anchor="middle" font-size="21" fill="#92400e" font-weight="700">Policy inputs: user constitution + enterprise authority</text>
<text x="720" y="420" text-anchor="middle" font-size="18" fill="#8c6429" font-weight="400">Scope, purpose, exclusions, permissions, and context representation</text>
<rect x="70" y="458" width="620" height="213" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="380" y="496" text-anchor="middle" font-size="24" fill="#3730a3" font-weight="700">ASYNC · Dream / maintenance loop</text>
<text x="380" y="533" text-anchor="middle" font-size="20" fill="#4f46e5" font-weight="400">Read experience and source evidence</text>
<text x="380" y="570" text-anchor="middle" font-size="20" fill="#4f46e5" font-weight="400">Write / update · Consolidate / reconcile</text>
<text x="380" y="607" text-anchor="middle" font-size="20" fill="#4f46e5" font-weight="400">Prune / reorganize persistent memory</text>
<text x="380" y="644" text-anchor="middle" font-size="19" fill="#4f46e5" font-weight="400">Maintain components, indexes, and references</text>
<rect x="750" y="458" width="620" height="213" rx="14" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.5"/>
<text x="1060" y="496" text-anchor="middle" font-size="24" fill="#115e59" font-weight="700">SYNC · Query / retrieval loop</text>
<text x="1060" y="533" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="400">Search / retrieve · Resolve / verify</text>
<text x="1060" y="570" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="400">Reconcile evidence · Summarize / prune response</text>
<text x="1060" y="607" text-anchor="middle" font-size="20" fill="#0f766e" font-weight="400">Choose query-relevant representation</text>
<text x="1060" y="644" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="400">Return only permitted context to the task agent</text>
<path d="M 380 711 L 380 738" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M 1060 711 L 1060 738" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="40" y="750" width="1360" height="90" rx="16" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.5"/>
<text x="720" y="785" text-anchor="middle" font-size="25" fill="#115e59" font-weight="700">Governed memory tool interfaces</text>
<text x="720" y="815" text-anchor="middle" font-size="19" fill="#0f766e" font-weight="400">Read / query evidence · Read / update derived memory · Source references · Versions · Access checks</text>
<path d="M 720 852 L 720 878" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="40" y="890" width="1360" height="224" rx="18" fill="#f8fafc" stroke="#dbe3ed" stroke-width="1.5"/>
<text x="65" y="922" text-anchor="start" font-size="17" fill="#64748b" font-weight="700">SHARED LOGICAL STATE — BOTH MODES ACCESS BOTH COMPONENTS</text>
<rect x="70" y="944" width="590" height="138" rx="14" fill="#eaf3fa" stroke="#bad3e8" stroke-width="1.5"/>
<text x="365" y="982" text-anchor="middle" font-size="25" fill="#164e75" font-weight="700">1 · Personal timeline</text>
<text x="365" y="1017" text-anchor="middle" font-size="20" fill="#336888" font-weight="400">Events · Decisions · Outcomes · Corrections</text>
<text x="365" y="1052" text-anchor="middle" font-size="19" fill="#336888" font-weight="400">Retained evidence and provenance</text>
<rect x="780" y="944" width="590" height="138" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1075" y="982" text-anchor="middle" font-size="25" fill="#0f172a" font-weight="700">Derived memory components</text>
<text x="1075" y="1017" text-anchor="middle" font-size="20" fill="#475569" font-weight="400">Model-organized artifacts, views, and programs</text>
<text x="1075" y="1052" text-anchor="middle" font-size="19" fill="#475569" font-weight="400">Versioned interpretations with source dependencies</text>
<path d="M 672 1025 L 768 1025" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)"/>
<text x="720" y="1007" text-anchor="middle" font-size="17" fill="#64748b" font-weight="400">grounds</text>
<path d="M 720 1126 L 720 1161" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="744" y="1150" text-anchor="start" font-size="18" fill="#64748b" font-weight="400">persistence adapters</text>
<rect x="40" y="1173" width="1360" height="97" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="720" y="1208" text-anchor="middle" font-size="25" fill="#0f172a" font-weight="700">Storage mechanisms</text>
<text x="720" y="1241" text-anchor="middle" font-size="21" fill="#475569" font-weight="400">Files / object stores · Databases · Vector stores</text>
<rect x="40" y="1301" width="760" height="87" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420" y="1335" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="700">3 · Durable work runtime</text>
<text x="420" y="1366" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Checkpoints · Scheduling · Retries · Cancellation · Audit</text>
<rect x="825" y="1301" width="575" height="87" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1112" y="1335" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="700">4 · Skills and programs</text>
<text x="1112" y="1366" text-anchor="middle" font-size="18" fill="#475569" font-weight="400">Retrieval · Maintenance · Context presentation</text>
<text x="40" y="1418" text-anchor="start" font-size="18" fill="#64748b" font-weight="400">Task agents have no direct personal-memory access. Sync pruning changes the response; async pruning changes derived memory.</text>
</g>
