<text x="875" y="172" text-anchor="start" font-size="19" font-weight="400" fill="#8c6429">Entitlements, information barriers, approvals</text>
<text x="875" y="199" text-anchor="start" font-size="19" font-weight="400" fill="#8c6429">Enforced on every read, write, and share</text>
<path d="M 720 228 L 720 254" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="265" width="540" height="402" rx="20" fill="#f8fafc" stroke="#b9c7da" stroke-width="1.5"/>
<text x="720" y="303" text-anchor="middle" font-size="27" font-weight="700" fill="#3730a3">2 · Memory agent</text>
<text x="720" y="333" text-anchor="middle" font-size="20" font-weight="400" fill="#4f46e5">Represents the user across tasks</text>
<rect x="470" y="362" width="240" height="148" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="590" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#3730a3">Async maintenance</text>
<text x="590" y="431" text-anchor="middle" font-size="19" font-weight="400" fill="#4f46e5">Write and update</text>
<text x="590" y="459" text-anchor="middle" font-size="19" font-weight="400" fill="#4f46e5">Dream and consolidate</text>
<text x="590" y="487" text-anchor="middle" font-size="17" font-weight="400" fill="#4f46e5">Ground in timeline events</text>
<rect x="730" y="362" width="240" height="148" rx="14" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.5"/>
<text x="850" y="397" text-anchor="middle" font-size="21" font-weight="700" fill="#115e59">Sync context service</text>
<text x="850" y="431" text-anchor="middle" font-size="19" font-weight="400" fill="#0f766e">Query and retrieve</text>
<text x="850" y="459" text-anchor="middle" font-size="19" font-weight="400" fill="#0f766e">Select and represent</text>
<text x="850" y="487" text-anchor="middle" font-size="17" font-weight="400" fill="#0f766e">Apply sharing settings</text>
<rect x="470" y="533" width="500" height="109" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="720" y="567" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Derived memory and source references</text>
<text x="720" y="598" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">Files · Databases · Vector stores</text>
<text x="720" y="626" text-anchor="middle" font-size="17" font-weight="400" fill="#64748b">Versioned and grounded in retained evidence</text>
<rect x="40" y="365" width="340" height="157" rx="14" fill="#eaf3fa" stroke="#bad3e8" stroke-width="1.5"/>
<text x="210" y="402" text-anchor="middle" font-size="24" font-weight="700" fill="#164e75">1 · Personal timeline</text>
<text x="210" y="436" text-anchor="middle" font-size="20" font-weight="400" fill="#336888">Events and observations</text>
<text x="210" y="466" text-anchor="middle" font-size="20" font-weight="400" fill="#336888">Decisions and outcomes</text>
<text x="210" y="496" text-anchor="middle" font-size="19" font-weight="400" fill="#336888">Evidence and provenance</text>
