<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc">
<title id="title">Agentic memory: strategy, tools, and stores</title><desc id="desc">A memory agent chooses how to organize evidence and supply task context. Durable, governed tool interfaces separate those choices from files, databases, and vector stores.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="655" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="48" text-anchor="start" font-size="30" font-weight="700" fill="#0f172a">Memory through tools</text>
<text x="100" y="100" text-anchor="start" font-size="15" font-weight="700" fill="#64748b">MODEL-CHOSEN STRATEGY</text>
<rect x="100" y="117" width="1000" height="112" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="600" y="150" text-anchor="middle" font-size="25" font-weight="700" fill="#3730a3">Memory agent</text>
<text x="600" y="178" text-anchor="middle" font-size="20" font-weight="400" fill="#4f46e5">Organizes evidence and selects task context</text>
<text x="600" y="207" text-anchor="middle" font-size="18" font-weight="400" fill="#4f46e5">Write  ·  Update  ·  Consolidate  ·  Query  ·  Share</text>
<path d="M 600 239 L 600 277" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="100" y="280" text-anchor="start" font-size="15" font-weight="700" fill="#64748b">OPERATIONS AND GUARANTEES</text>
<rect x="100" y="295" width="1000" height="94" rx="14" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.5"/>
<text x="600" y="332" text-anchor="middle" font-size="25" font-weight="700" fill="#115e59">Durable, governed tool interfaces</text>
<text x="600" y="364" text-anchor="middle" font-size="18" font-weight="400" fill="#0f766e">Authorized operations  ·  Checkpoints  ·  Provenance  ·  Scoped sharing</text>
<path d="M 600 400 L 600 437" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 250 437 L 950 437" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 250 437 L 250 472" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="486" width="300" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="250" y="523" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Files</text>
<text x="250" y="553" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">Read, write, search</text>
<path d="M 600 437 L 600 472" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="486" width="300" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="600" y="523" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Databases</text>
<text x="600" y="553" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">Query and update</text>
<path d="M 950 437 L 950 472" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="800" y="486" width="300" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="950" y="523" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Vector stores</text>
<text x="950" y="553" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">Index and retrieve</text>
<text x="36" y="632" text-anchor="start" font-size="18" font-weight="400" fill="#64748b">Sharing follows user instructions and enterprise policy. Derived-memory updates can run asynchronously.</text>
</g>
</svg>
